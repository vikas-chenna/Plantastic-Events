<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.4.0/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            width: 400px;
        }
        label, input {
            display: block;
            width: 100%;
            margin-bottom: 10px;
        }
        button {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
        }
    </style>
    <link rel="stylesheet" href="assets/css/responsive-v5.css">
</head>
<body>
    <div class="container">
        <h2>Generate Bill</h2>
        <form id="billForm">
            <label>Customer Name</label>
            <input type="text" id="customerName" required>
            
            <label>Customer Email</label>
            <input type="email" id="customerEmail" required>
            
            <label>Service Provided</label>
            <input type="text" id="service" required>
            
            <label>Amount (₹)</label>
            <input type="number" id="amount" required>
            
            <button type="button" onclick="generateBill()">Generate & Send Bill</button>
        </form>
    </div>

    <script>
        (function() {
            emailjs.init("YOUR_EMAILJS_USER_ID"); // Replace with your EmailJS User ID
        })();

        function generateBill() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            const name = document.getElementById("customerName").value;
            const email = document.getElementById("customerEmail").value;
            const service = document.getElementById("service").value;
            const amount = document.getElementById("amount").value;
            
            if (!name || !email || !service || !amount) {
                alert("Please fill all fields");
                return;
            }
            
            doc.text("Bill Receipt", 20, 20);
            doc.text(`Customer Name: ${name}`, 20, 40);
            doc.text(`Service: ${service}`, 20, 50);
            doc.text(`Amount: ₹${amount}`, 20, 60);
            doc.text("Thank you for your business!", 20, 80);
            
            const pdfData = doc.output("datauristring");
            sendEmail(email, pdfData);
        }
        
        function sendEmail(email, pdfData) {
            emailjs.send("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", {
                to_email: email,
                pdf_attachment: pdfData
            }).then(response => {
                alert("Bill sent successfully!");
            }).catch(error => {
                alert("Error sending bill");
                console.error(error);
            });
        }
    </script>
</body>
</html>
